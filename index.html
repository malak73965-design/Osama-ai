<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع الذكاء الاصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Tajawal', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center p-4">

    <!-- Title -->
    <header class="w-full max-w-2xl text-center my-6">
        <h1 class="text-3xl font-bold text-indigo-400">🤖 منصة الذكاء الاصطناعي</h1>
        <p class="text-slate-400 text-sm mt-1">تطبيق تفاعلي جاهز للعمل مباشرة</p>
    </header>

    <!-- Chat App -->
    <main class="w-full max-w-2xl bg-slate-800 rounded-2xl border border-slate-700 flex flex-col h-[70vh] shadow-xl">
        <!-- API Key Input -->
        <div class="p-3 bg-slate-850 border-b border-slate-700 flex items-center gap-2">
            <label for="apiKey" class="text-xs text-slate-300 font-medium whitespace-nowrap">مفتاح API Key:</label>
            <input type="password" id="apiKey" placeholder="ضع مفتاح Gemini API هنا..." class="flex-1 bg-slate-900 border border-slate-600 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
        </div>

        <!-- Messages Area -->
        <div id="chatBox" class="flex-1 overflow-y-auto p-4 space-y-3">
            <div class="bg-slate-700/50 p-3 rounded-xl max-w-[85%] text-xs text-slate-300">
                مرحباً بك! أدخل مفتاح Gemini API الخاص بك في الأعلى، ثم اكتب أي سؤال للبدء.
            </div>
        </div>

        <!-- Input Form -->
        <div class="p-3 border-t border-slate-700">
            <form onsubmit="handleSubmit(event)" class="flex gap-2">
                <input type="text" id="userInput" placeholder="اكتب سؤالك هنا..." required class="flex-1 bg-slate-900 border border-slate-600 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
                <button type="submit" id="sendBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-5 py-2.5 rounded-xl text-sm transition-all">إرسال</button>
            </form>
        </div>
    </main>

    <script>
        async function handleSubmit(e) {
            e.preventDefault();
            const apiKey = document.getElementById('apiKey').value.trim();
            const userInput = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const sendBtn = document.getElementById('sendBtn');
            const prompt = userInput.value.trim();

            if (!apiKey) {
                alert('يرجى إدخال مفتاح Gemini API في الأعلى أولاً.');
                return;
            }
            if (!prompt) return;

            appendMsg('user', prompt);
            userInput.value = '';
            sendBtn.disabled = true;

            const loadingId = appendMsg('ai', 'جاري التفكير...');

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await res.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    updateMsg(loadingId, data.candidates[0].content.parts[0].text);
                } else {
                    updateMsg(loadingId, 'خطأ: ' + (data.error?.message || 'تعذر جلب الإجابة.'));
                }
            } catch (err) {
                updateMsg(loadingId, 'حدث خطأ في الاتصال بالخادم.');
            } finally {
                sendBtn.disabled = false;
            }
        }

        function appendMsg(sender, text) {
            const chatBox = document.getElementById('chatBox');
            const div = document.createElement('div');
            const id = 'msg-' + Date.now();
            div.id = id;
            div.className = sender === 'user' 
                ? 'bg-indigo-600 text-white p-3 rounded-xl max-w-[85%] mr-auto text-xs whitespace-pre-wrap' 
                : 'bg-slate-700 text-slate-200 p-3 rounded-xl max-w-[85%] text-xs whitespace-pre-wrap';
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return id;
        }

        function updateMsg(id, text) {
            const el = document.getElementById(id);
            if (el) el.innerText = text;
        }
    </script>
</body>
</html>
